async function loadRealIntakes() {
    try {
        const response = await fetch(`${API_URL}/api/intakes`);

        if (!response.ok) {
            throw new Error("Could not load intakes");
        }

        const data = await response.json();

        return (data.intakes || []).map(item => {
            const fields = item.fields || {};
            const validation = item.validation || {};

            return [
                fields.full_name || "Unnamed Client",
                item.industry || "General",
                item.intake_id,
                item.created_at
                    ? item.created_at.slice(0, 10)
                    : "—",
                validation.completion_percentage || 0,
                item.status || "In progress"
            ];
        });
    } catch (error) {
        console.error("Dashboard loading error:", error);
        return [];
    }
}




async function callIntakeAgent(message) {
    const industryMap = {
        "Legal": "legal",
        "Insurance": "insurance",
        "Business Consulting": "business consulting",
        "General": "general"
    };

    const response = await fetch(`${API_URL}/api/agent/chat`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            industry: industryMap[S.ind],
            intake_id: S.id,
            messages: [
                ...S.apiMessages,
                { role: "user", content: message }
            ],
            current_fields: S.apiFields
        })
    });

    // Keep your existing code below this line.


    if (!response.ok) {
        let detail = `HTTP ${response.status}`;

        try {
            const errorData = await response.json();
            detail = errorData.detail || detail;
        } catch {}

        throw new Error(detail);
    }

    const data = await response.json();

    S.apiMessages.push(
        { role: "user", content: message },
        { role: "assistant", content: data.assistant_message }
    );

    S.apiFields = data.extracted_fields || {};
    S.apiValidation = data.validation || {};

    const f = S.apiFields;

    if (f.full_name) S.client.name = f.full_name;
    if (f.contact_email) S.client.email = f.contact_email;

    const fieldMap = {
        matter_type: "type",
        matter_description: "summary",
        policy_number: "policy",
        incident_date: "incident_date",
        incident_description: "incident",
        organization: "biz",
        service_needed: "need",
        business_goal: "goal"
    };

    Object.entries(fieldMap).forEach(([apiKey, uiKey]) => {
        if (f[apiKey]) S.ans[uiKey] = f[apiKey];
    });

    return data;
}

async function ask() {
    if (S.typing) return;

    S.typing = true;
    paint();

    try {
        const data = await callIntakeAgent(
            `Hello! I would like to start a ${S.ind} intake.`
        );

        S.msgs.push({
            r: "ai",
            t: data.assistant_message,
            time: now()
        });
    } catch (error) {
        S.msgs.push({
            r: "ai",
            t: "I couldn't connect to the AI service. Please check that the backend is running and try again. Error: " + error.message,
            time: now()
        });
    }

    S.typing = false;
    paint();
}

async function send(t) {
    t = t.trim();

    if (!t || S.typing) return;

    S.msgs.push({
        r: "me",
        t,
        time: now()
    });

    S.typing = true;
    paint();

    try {
        const data = await callIntakeAgent(t);

        S.msgs.push({
            r: "ai",
            t: data.assistant_message,
            time: now()
        });
    } catch (error) {
        S.msgs.push({
            r: "ai",
            t: "Sorry, I couldn't reach the AI backend. Please try again. Error: " + error.message,
            time: now()
        });
    }

    S.typing = false;
    paint();
}

function paint() {
    const m = $("#msgs");
    if (!m) return;

    m.innerHTML = S.msgs.map(x =>
        `<div class="b ${x.r}">${esc(x.t)}<small>${x.time}</small></div>`
    ).join("") +
    (S.typing
        ? '<div class="b ai dots"><span></span><span></span><span></span></div>'
        : "");

    m.scrollTop = m.scrollHeight;

    const percentage = S.apiValidation.completion_percentage ?? pct();

    const p = $("#prog");
    if (p) {
        p.innerHTML = `
            <b>${percentage}%</b> complete
            <div class="bar">
                <i style="width:${percentage}%"></i>
            </div>
        `;
    }

    const sg = $("#sugg");
    if (sg) sg.innerHTML = "";
}

async function table() {
    const rows = await loadRealIntakes();

    let r = rows.filter(x =>
        (tbl.f === "All" || x[5] === tbl.f) &&
        (x[0] + x[2]).toLowerCase().includes(tbl.q.toLowerCase())
    ).sort((a, b) =>
        (a[tbl.s] > b[tbl.s] ? 1 : -1) * tbl.d * -1
    );

    const pages = Math.max(1, Math.ceil(r.length / 5));
    tbl.p = Math.min(tbl.p, pages - 1);

    $("#tb").innerHTML = r.slice(tbl.p * 5, tbl.p * 5 + 5)
        .map(x => `
            <tr>
                <td>${esc(x[0])}</td>
                <td>${esc(x[1])}</td>
                <td>${esc(x[2])}</td>
                <td>${esc(x[3])}</td>
                <td>${x[4]}%</td>
                <td>${esc(x[5])}</td>
                <td>
                    <button class="btn s sm"
                        onclick="go('review')">Review</button>
                </td>
            </tr>
        `).join("") ||
        '<tr><td colspan="7" class="mut">No matching clients.</td></tr>';

    $("#pg").innerHTML = `
        <button class="btn s sm" id="pv"
            ${tbl.p < 1 ? "disabled" : ""}>Previous</button>
        <span class="sm mut">Page ${tbl.p + 1} of ${pages}</span>
        <button class="btn s sm" id="nx"
            ${tbl.p >= pages - 1 ? "disabled" : ""}>Next</button>
    `;

    $("#pv").onclick = () => {
        tbl.p--;
        table();
    };

    $("#nx").onclick = () => {
        tbl.p++;
        table();
    };
}

function bind(v){const on=(s,ev,fn)=>{const e=$(s);if(e)e.addEventListener(ev,fn)};
 
if (v === "overview") {
    fetch(`${API_URL}/api/dashboard/stats`)
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load dashboard statistics");
            }
            return response.json();
        })
        .then(stats => {
            $("#kp").innerHTML = [
                ["Total clients", stats.total_clients],
                ["Active sessions", stats.active_intakes],
                ["Completed", stats.completed_intakes],
                ["Pending reviews", stats.pending_reviews]
            ].map(k => `
                <div class="card">
                    <div class="mut sm">${k[0]}</div>
                    <b style="font-size:26px">${k[1]}</b>
                </div>
            `).join("");
        })
        .catch(error => {
            console.error("Dashboard statistics error:", error);
            $("#kp").innerHTML =
                '<div class="card">Unable to load statistics.</div>';
        });

    $("#ch").innerHTML = [3,5,2,6,4,7,5]
        .map(h => `<i style="flex:1;height:${h*14}px;background:linear-gradient(var(--sec),var(--pri));border-radius:5px 5px 0 0"></i>`)
        .join("");

    $("#ind").innerHTML = Object.keys(Q).map(k => {
        const n = ROWS.filter(x => x[1] === k).length;
        return `<div class="sm">${k} (${n})</div><div class="bar" style="margin-bottom:6px"><i style="width:${n*25}%"></i></div>`;
    }).join("");

    on("#q", "input", e => {
        tbl.q = e.target.value;
        tbl.p = 0;
        table();
    });

    on("#f", "change", e => {
        tbl.f = e.target.value;
        tbl.p = 0;
        table();
    });

    document.querySelectorAll("th[data-s]").forEach(t => {
        t.onclick = () => {
            tbl.d = tbl.s == +t.dataset.s ? -tbl.d : 1;
            tbl.s = +t.dataset.s;
            table();
        };
    });

    table();
}

 
if (v === "intake") {
    on("#dm", "click", demo);

    if (!S.ind) {
        let pick = "Legal";

        document.querySelectorAll("[data-i]").forEach(b => {
            b.onclick = () => {
                pick = b.dataset.i;

                document.querySelectorAll("[data-i]").forEach(x => {
                    x.style.borderColor =
                        x === b ? "var(--pri)" : "";
                });
            };
        });

        const legalButton = document.querySelector('[data-i="Legal"]');
        if (legalButton) legalButton.click();

        on("#st", "click", () => {
            const n = $("#n").value.trim();
            const e = $("#e").value.trim();

            if (!n || !/^\S+@\S+\.\S+$/.test(e)) {
                $("#err").textContent =
                    "Enter your name and a valid email address.";
                return;
            }

            S.ind = pick;
            S.client = {
                name: n,
                email: e,
                phone: $("#p").value.trim(),
                address: $("#a").value.trim()
            };

            S.ans = {};
            S.msgs = [];
            S.apiMessages = [];
            S.apiFields = {
            full_name: S.client.name,
            contact_email: S.client.email
            };
            S.apiValidation = {};
            S.qi = 0;
            S.docs = [];
            S.res = {};
            S.clar = {};

            go("intake");
            render("intake");
            ask();
        });
    } else {
        paint();

        on("#sub", "click", () => {
            S.rev.st = "Submitted";
            S.rev.log.push(
                now() + ": Client submitted intake for professional review"
            );
            go("status");
        });

        const ti = $("#ti");

        on("#sd", "click", () => {
            send(ti.value);
            ti.value = "";
        });

        on("#ti", "keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                send(ti.value);
                ti.value = "";
            }
        });

        if (!S.msgs.length) ask();
    }
}
